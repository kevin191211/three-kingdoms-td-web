#canvas {

/* Android 全螢幕按鈕 */

	display: none;

	bottom: 8px;
	right: 8px;
	z-index: 9999;
	background: rgba(0,0,0,0.5);
	border: 1px solid rgba(255,255,255,0.3);
	color: white;
	font-size: 0.75rem;

	border-radius: 14px;
	cursor: pointer;
	font-family: 'Noto Sans TC', 'Noto Sans', Arial, sans-serif;

}

	background: rgba(255,255,255,0.2);
}

/* 直向提示 */
#rotate-notice {
	display: none;
	position: fixed;
	top: 0; left: 0; right: 0; bottom: 0;
	background: #111;
	color: #fff;
	font-family: 'Noto Sans TC', 'Noto Sans', Arial, sans-serif;
	font-size: 1.5rem;
	z-index: 20000;
	justify-content: center;
	align-items: center;
	flex-direction: column;
	text-align: center;
	gap: 1.2rem;
}
#rotate-notice .r-icon {
	font-size: 5rem;
	animation: rotate-anim 2s ease-in-out infinite;
}
@keyframes rotate-anim {
	0%, 100% { transform: rotate(0deg); }
	50% { transform: rotate(90deg); }
}
@media (orientation: portrait) and (max-width: 900px) {
	#rotate-notice { display: flex !important; }
	#canvas { display: none !important; }
	#fs-overlay { display: none !important; }
}

/* 載入畫面 */
#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}
#status, #status-splash {
	top: 0;
	bottom: 0;
}

	background-color: #242424;

	flex-direction: column;
	justify-content: center;
	align-items: center;

}
#status-splash {
	max-height: 100%;

#status-splash.show-image--false { display: none; }
#status-splash.fullsize--true {

#status-splash.use-filter--false { image-rendering: pixelated; }
#status-progress, #status-notice { display: none; }

	margin: 0 auto;

#status-notice {

	line-height: 1.3;
	margin: 0 2rem;

	padding: 1rem;
	text-align: center;
	z-index: 1;

	<body>
		<!-- 直向提示 -->

		<!-- Android 全螢幕小按鈕 -->

		<div id="status">

		<script>
		// Android 全螢幕（iPhone 不支援 Fullscreen API，不顯示按鈕）
		function goFS() {
			var el = document.documentElement;
			try {
				if (el.requestFullscreen) el.requestFullscreen({navigationUI:'hide'});
				else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
			} catch(e) {}
			try {
				if (screen.orientation && screen.orientation.lock)
					screen.orientation.lock('landscape').catch(function(){});
			} catch(e) {}
		}
		(function() {
			var ua = navigator.userAgent;
			var isAndroid = /Android/i.test(ua);
			var isIOS = /iPhone|iPad|iPod/i.test(ua);
			var isMobile = isAndroid || isIOS;
			// 只在 Android 上顯示全螢幕按鈕
			if (isAndroid) {
				var btn = document.getElementById('fs-btn-android');
				// 遊戲載入後顯示
				var check = setInterval(function() {
					var s = document.getElementById('status');
					if (!s || !s.parentNode || s.style.visibility === 'hidden') {
						clearInterval(check);
						btn.style.display = 'block';
					}
				}, 500);
				// 進入全螢幕後隱藏按鈕
				['fullscreenchange','webkitfullscreenchange'].forEach(function(evt) {
					document.addEventListener(evt, function() {
						var isFull = !!(document.fullscreenElement || document.webkitFullscreenElement);
						btn.style.display = isFull ? 'none' : 'block';
					});
				});
			}
		})();
		</script>

		<input id="godot-kb" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
			style="position:fixed;z-index:10000;display:none;opacity:0.01;font-size:16px;border:none;outline:none;background:transparent;color:transparent;caret-color:transparent;padding:0;margin:0;">
		<script>
		// ── 手機虛擬鍵盤輔助 ──
		// Godot 的 DisplayServer.virtual_keyboard_show() 在手機瀏覽器上不可靠，
		// 因為觸控事件被 canvas 攔截後，到 GDScript 信號觸發時已脫離瀏覽器的「使用者手勢」上下文。
		// 解法：在 touchstart（使用者手勢上下文內）直接 focus 一個真實的 HTML input。
		(function() {
			if (!/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) return;

			var inp = document.getElementById('godot-kb');
			window._gkb = {
				zones: {},
				active: null,
				register: function(id, ml) {
					this.zones[id] = {x:0, y:0, w:0, h:0, maxLen:ml||50, text:'', changed:false};
				},
				setPos: function(id, x, y, w, h) {
					var z = this.zones[id]; if (z) { z.x=x; z.y=y; z.w=w; z.h=h; }
				},
				unregister: function(id) {
					delete this.zones[id];
					if (this.active === id) { inp.blur(); this.active = null; }
				},
				setText: function(id, t) {
					var z = this.zones[id]; if (z) { z.text = t; if (this.active === id) inp.value = t; }
				},
				pollText: function(id) {
					var z = this.zones[id];
					if (!z || !z.changed) return null;
					z.changed = false;
					return z.text;
				}
			};

			var canvas = document.getElementById('canvas');
			canvas.addEventListener('touchstart', function(e) {
				var t = e.touches[0];
				var r = canvas.getBoundingClientRect();
				var tx = t.clientX - r.left, ty = t.clientY - r.top;
				var kb = window._gkb;

				for (var id in kb.zones) {
					var z = kb.zones[id];
					if (tx >= z.x && tx <= z.x + z.w && ty >= z.y && ty <= z.y + z.h) {
						inp.value = z.text;
						inp.maxLength = z.maxLen;
						inp.style.left = (r.left + z.x) + 'px';
						inp.style.top = (r.top + z.y) + 'px';
						inp.style.width = Math.max(z.w, 10) + 'px';
						inp.style.height = Math.max(z.h, 10) + 'px';
						inp.style.display = 'block';
						kb.active = id;
						inp.focus();
						e.preventDefault();
						e.stopPropagation();
						return;
					}
				}
				if (kb.active) inp.blur();
			}, {passive: false, capture: true});

			inp.addEventListener('input', function() {
				var kb = window._gkb;
				if (kb.active && kb.zones[kb.active]) {
					kb.zones[kb.active].text = inp.value;
					kb.zones[kb.active].changed = true;
				}
			});
			inp.addEventListener('blur', function() {
				inp.style.display = 'none';
				var kb = window._gkb;
				if (kb.active && kb.zones[kb.active]) kb.zones[kb.active].changed = true;
				kb.active = null;
			});
			inp.addEventListener('keydown', function(e) {
				if (e.key === 'Enter') inp.blur();
			});
		})();
		</script>

		<!-- 登入覆蓋層 -->
		<div id="google-login-overlay">
			<div class="login-title">三國迷陣防線</div>
			<div class="login-subtitle">登入以儲存遊戲紀錄</div>
			<div id="g_id_onload"
				data-client_id="507989598042-c5vmt17uhsgs4gh5bi797k6lq3hv4981.apps.googleusercontent.com"
				data-callback="handleGoogleLogin"

				data-auto_select="true">
			</div>
			<div class="g_id_signin"
				data-type="standard"
				data-size="large"
				data-theme="filled_black"
				data-text="signin_with"

				data-logo_alignment="left"
				data-locale="zh-TW">
			</div>
			<div class="login-divider">── 或 ──</div>
			<button class="social-btn fb-btn" onclick="handleFacebookLogin()" disabled style="opacity:0.5;cursor:not-allowed;">
				<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
				使用 Facebook 登入（即將推出）
			</button>
			<button id="apple-login-btn" class="social-btn apple-btn" onclick="handleAppleLogin()" disabled style="display:none;opacity:0.5;cursor:not-allowed;">
				<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
				使用 Apple 登入（即將推出）
			</button>
		</div>

		<script>
		// ── 登入管理 ──
		// localStorage 只存非機密的顯示資訊（不存 token）
		var savedProfile = null;
		try { savedProfile = JSON.parse(localStorage.getItem('_userProfile')); } catch(e) {}

		window._googleAuth = {
			isLoggedIn: false,
			userId: savedProfile ? savedProfile.userId : '',
			userName: savedProfile ? savedProfile.userName : '',
			userEmail: savedProfile ? savedProfile.userEmail : '',
			userAvatar: savedProfile ? savedProfile.userAvatar : '',
			idToken: '',
		};

		function handleGoogleLogin(response) {
			// 解析 JWT credential 取得使用者資料
			var payload = parseJwt(response.credential);
			window._googleAuth = {
				isLoggedIn: true,
				userId: payload.sub || '',
				userName: payload.name || '',
				userEmail: payload.email || '',
				userAvatar: payload.picture || '',
				idToken: response.credential,
			};
			// 只存非機密的顯示資訊到 localStorage（不存 token）
			localStorage.setItem('_userProfile', JSON.stringify({
				userId: window._googleAuth.userId,
				userName: window._googleAuth.userName,
				userEmail: window._googleAuth.userEmail,
				userAvatar: window._googleAuth.userAvatar,
			}));
			console.log('[GoogleAuth] 登入成功:', payload.name);
			// 隱藏登入覆蓋層
			document.getElementById('google-login-overlay').style.display = 'none';
		}

		function parseJwt(token) {
			try {
				var base64Url = token.split('.')[1];
				var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
				var jsonPayload = decodeURIComponent(
					atob(base64).split('').map(function(c) {
						return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
					}).join('')
				);
				return JSON.parse(jsonPayload);
			} catch (e) {
				console.error('[GoogleAuth] JWT 解析失敗:', e);
				return {};
			}
		}

		// 登出功能（供 Godot 呼叫）
		function googleSignOut() {
			if (typeof google !== 'undefined' && google.accounts) {
				google.accounts.id.disableAutoSelect();
			}
			window._googleAuth = {
				isLoggedIn: false,
				userId: '',
				userName: '',
				userEmail: '',
				userAvatar: '',
				idToken: '',
			};
			localStorage.removeItem('_userProfile');
			console.log('[GoogleAuth] 已登出');
			// 登出後強制顯示登入畫面
			document.getElementById('google-login-overlay').style.display = 'flex';
		}

		// 顯示登入覆蓋層（供 Godot 呼叫）
		function showGoogleLogin() {
			document.getElementById('google-login-overlay').style.display = 'flex';
		}

		// Facebook 登入預留（尚未實作）
		function handleFacebookLogin() {
			console.log('[Auth] Facebook 登入尚未實作');
		}

		// Apple 登入預留（尚未實作）
		function handleAppleLogin() {
			console.log('[Auth] Apple 登入尚未實作');
		}

		// iPhone/iPad 才顯示 Apple 登入按鈕
		(function() {
			if (/iPhone|iPad|iPod|Macintosh/i.test(navigator.userAgent)) {
				var appleBtn = document.getElementById('apple-login-btn');
				if (appleBtn) appleBtn.style.display = 'flex';
			}
		})();
		</script>

		<script src="index.js"></script>
		<script>
		const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":28530512,"index.wasm":37685705},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
		const GODOT_THREADS_ENABLED = false;
		const engine = new Engine(GODOT_CONFIG);

		(function () {
			const statusOverlay = document.getElementById('status');
			const statusProgress = document.getElementById('status-progress');
			const statusNotice = document.getElementById('status-notice');

			let initializing = true;
			let statusMode = '';

			function setStatusMode(mode) {
				if (statusMode === mode || !initializing) return;
				if (mode === 'hidden') {
					statusOverlay.remove();
					initializing = false;
					return;
				}
				statusOverlay.style.visibility = 'visible';
				statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
				statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
				statusMode = mode;
			}

			function setStatusNotice(text) {
				while (statusNotice.lastChild) statusNotice.removeChild(statusNotice.lastChild);
				text.split('\n').forEach((line) => {
					statusNotice.appendChild(document.createTextNode(line));
					statusNotice.appendChild(document.createElement('br'));
				});
			}

			function displayFailureNotice(err) {
				console.error(err);
				if (err instanceof Error) setStatusNotice(err.message);
				else if (typeof err === 'string') setStatusNotice(err);
				else setStatusNotice('An unknown error occurred.');
				setStatusMode('notice');
				initializing = false;
			}

			const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });

			if (missing.length !== 0) {
				if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
					let swPromise;
					try { swPromise = navigator.serviceWorker.getRegistration(); }
					catch (err) { swPromise = Promise.reject(new Error('Service worker registration failed.')); }
					Promise.race([
						swPromise.then((reg) => {
							if (reg != null) return Promise.reject(new Error('Service worker already exists.'));
							return reg;
						}).then(() => engine.installServiceWorker()),
						new Promise((resolve) => setTimeout(() => resolve(), 2000)),
					]).then(() => window.location.reload())
					.catch((err) => console.error('Error while registering service worker:', err));
				} else {
					displayFailureNotice('Error\nThe following features required to run Godot projects on the Web are missing:\n' + missing.join('\n'));
				}
			} else {
				setStatusMode('progress');
				engine.startGame({
					'onProgress': function (current, total) {
						if (current > 0 && total > 0) {
							statusProgress.value = current;
							statusProgress.max = total;
						} else {
							statusProgress.removeAttribute('value');
							statusProgress.removeAttribute('max');
						}
					},
				}).then(() => {
					setStatusMode('hidden');
					// 遊戲載入完成後，若尚未登入則強制顯示登入覆蓋層
					// 回訪用戶：Google auto_select 會自動靜默登入取得新 token
					// 新用戶：顯示登入按鈕
					if (!window._googleAuth.isLoggedIn) {
						// 給 auto_select 1.5 秒嘗試靜默登入
						setTimeout(function() {
							if (!window._googleAuth.isLoggedIn) {
								document.getElementById('google-login-overlay').style.display = 'flex';
							}
						}, 1500);
					}
				}, displayFailureNotice);
			}
		}());
		</script>
