html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}
body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}
#canvas {
	display: block;
	width: 100vw !important;
	height: 100vh !important;
	height: 100dvh !important;
}
#canvas:focus {
	outline: none;
}

/* Android 全螢幕按鈕 */
#fs-btn-android {
	display: none;
	position: fixed;
	bottom: 8px;
	right: 8px;
	z-index: 9999;
	background: rgba(0,0,0,0.5);
	border: 1px solid rgba(255,255,255,0.3);
	color: white;
	font-size: 0.75rem;
	padding: 4px 10px;
	border-radius: 14px;
	cursor: pointer;
	font-family: 'Noto Sans TC', 'Noto Sans', Arial, sans-serif;
	-webkit-tap-highlight-color: transparent;
}
#fs-btn-android:active {
	background: rgba(255,255,255,0.2);
}

/* 直向提示 */
#rotate-notice {
	display: none;
	position: fixed;
	top: 0; left: 0; right: 0; bottom: 0;
	background: #111;
	color: #fff;
	font-family: 'Noto Sans TC', 'Noto Sans', Arial, sans-serif;
	font-size: 1.5rem;
	z-index: 20000;
	justify-content: center;
	align-items: center;
	flex-direction: column;
	text-align: center;
	gap: 1.2rem;
}
#rotate-notice .r-icon {
	font-size: 5rem;
	animation: rotate-anim 2s ease-in-out infinite;
}
@keyframes rotate-anim {
	0%, 100% { transform: rotate(0deg); }
	50% { transform: rotate(90deg); }
}
@media (orientation: portrait) and (max-width: 900px) {
	#rotate-notice { display: flex !important; }
	#canvas { display: none !important; }
	#fs-overlay { display: none !important; }
}

/* 載入畫面 */
#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}
#status, #status-splash {
	top: 0;
	bottom: 0;
}
#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}
#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}
#status-splash.show-image--false { display: none; }
#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}
#status-splash.use-filter--false { image-rendering: pixelated; }
#status-progress, #status-notice { display: none; }

/* --- 三國風進度條 --- */
#status-progress-wrap {
	position: absolute;
	bottom: 12%;
	left: 50%;
	transform: translateX(-50%);
	width: min(70%, 320px);
	display: none;
}
#status-progress-label {
	color: #d4c9a8;
	font-family: 'Noto Sans', 'Noto Serif TC', serif;
	font-size: 13px;
	text-align: center;
	margin-bottom: 6px;
	letter-spacing: 2px;
	text-shadow: 0 1px 3px rgba(0,0,0,0.8);
}
#status-progress-track {
	position: relative;
	height: 18px;
	background: linear-gradient(180deg, #1a1209 0%, #2a1f10 50%, #1a1209 100%);
	border: 2px solid #8b7340;
	border-radius: 3px;
	box-shadow: 0 0 8px rgba(139,115,64,0.4), inset 0 1px 3px rgba(0,0,0,0.6);
	overflow: hidden;
}
#status-progress-fill {
	position: absolute;
	top: 0; left: 0; bottom: 0;
	width: 0%;
	background: linear-gradient(180deg, #c9a530 0%, #a67c00 40%, #c9a530 60%, #8b6914 100%);
	border-radius: 1px;
	transition: width 0.3s ease;
	box-shadow: 0 0 10px rgba(201,165,48,0.5);
}
#status-progress-fill::after {
	content: '';
	position: absolute;
	top: 2px; left: 4px; right: 4px;
	height: 5px;
	background: linear-gradient(180deg, rgba(255,255,220,0.4), transparent);
	border-radius: 2px;
}
#status-progress-pct {
	position: absolute;
	top: 0; left: 0; right: 0; bottom: 0;
	display: flex;
	align-items: center;
	justify-content: center;
	color: #fff;
	font-family: 'Noto Sans', sans-serif;
	font-size: 11px;
	font-weight: bold;
	text-shadow: 0 1px 2px rgba(0,0,0,0.9);
	z-index: 1;
}
/* 進度條呼吸光暈動畫 */
@keyframes progressGlow {
	0%, 100% { box-shadow: 0 0 8px rgba(139,115,64,0.4), inset 0 1px 3px rgba(0,0,0,0.6); }
	50% { box-shadow: 0 0 14px rgba(201,165,48,0.6), inset 0 1px 3px rgba(0,0,0,0.6); }
}
#status-progress-track.active {
	animation: progressGlow 2s ease-in-out infinite;
}

/* 隱藏原生 progress */
#status-progress { display: none !important; }
#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

		<script>
		// ── 廣告橋接：供 Godot JavaScriptBridge 呼叫 ──
		window._rewardedAd = {
			ready: false,
			watching: false,
			result: null,   // "rewarded" | "dismissed" | "error"
			errorMsg: "",

			init: function() {
				// adBreak / adConfig 由 Google Ad Placement API 注入
				if (typeof adConfig === 'function') {
					adConfig({
						preloadAdBreaks: 'on',
						onReady: function() {
							console.log('[Ad] Ad Placement API ready');
							window._rewardedAd.ready = true;
						}
					});
				} else {
					console.warn('[Ad] adConfig not available, ads will use fallback');
				}
			},

			show: function() {
				window._rewardedAd.watching = true;
				window._rewardedAd.result = null;
				window._rewardedAd.errorMsg = "";

				if (typeof adBreak === 'function') {
					adBreak({
						type: 'reward',
						name: 'watch_ad_for_gems',
						beforeReward: function(showAdFn) {
							showAdFn();
						},
						adDismissed: function() {
							console.log('[Ad] dismissed');
							window._rewardedAd.watching = false;
							window._rewardedAd.result = "dismissed";
						},
						adViewed: function() {
							console.log('[Ad] viewed / rewarded');
							window._rewardedAd.watching = false;
							window._rewardedAd.result = "rewarded";
						},
						adBreakDone: function(placementInfo) {
							console.log('[Ad] adBreakDone:', placementInfo.breakStatus);
							if (placementInfo.breakStatus === 'notReady' ||
								placementInfo.breakStatus === 'frequencyCapped' ||
								placementInfo.breakStatus === 'other') {
								// 廣告不可用 → fallback 模擬
								window._rewardedAd._fallback();
							}
						}
					});
				} else {
					// SDK 未載入 → fallback 模擬
					window._rewardedAd._fallback();
				}
			},

			_fallback: function() {
				// 開發/測試用：模擬 5 秒廣告
				console.log('[Ad] fallback: simulating 5s ad');
				setTimeout(function() {
					window._rewardedAd.watching = false;
					window._rewardedAd.result = "rewarded";
				}, 5000);
			}
		};

/* ── 登入覆蓋層動畫 ── */
@keyframes loginFadeIn {
	from { opacity: 0; }
	to { opacity: 1; }
}
@keyframes loginSlideUp {
	from { opacity: 0; transform: translateY(30px); }
	to { opacity: 1; transform: translateY(0); }
}
@keyframes loginLogoIn {
	from { opacity: 0; transform: scale(0.7); }
	to { opacity: 1; transform: scale(1); }
}
@keyframes loginGlow {
	0%, 100% { box-shadow: 0 0 20px rgba(212,175,55,0.3), 0 0 40px rgba(212,175,55,0.1); }
	50% { box-shadow: 0 0 30px rgba(212,175,55,0.5), 0 0 60px rgba(212,175,55,0.2); }
}
@keyframes loginShimmer {
	0% { background-position: -200% center; }
	100% { background-position: 200% center; }
}
/* Ken Burns 背景緩動 */
@keyframes kenBurns {
	0%   { transform: scale(1.0) translate(0, 0); }
	25%  { transform: scale(1.08) translate(-1%, -0.5%); }
	50%  { transform: scale(1.12) translate(0.5%, -1%); }
	75%  { transform: scale(1.06) translate(-0.5%, 0.5%); }
	100% { transform: scale(1.0) translate(0, 0); }
}
/* Logo 呼吸光暈 */
@keyframes logoPulse {
	0%, 100% { filter: drop-shadow(0 4px 16px rgba(212,175,55,0.4)) drop-shadow(0 0 8px rgba(212,175,55,0.1)); }
	50%      { filter: drop-shadow(0 4px 20px rgba(212,175,55,0.6)) drop-shadow(0 0 16px rgba(212,175,55,0.25)); }
}
/* 卡片邊框光暈呼吸 */
@keyframes cardGlow {
	0%, 100% { border-color: rgba(212,175,55,0.25); box-shadow: 0 0 20px rgba(212,175,55,0.05); }
	50%      { border-color: rgba(212,175,55,0.4);  box-shadow: 0 0 30px rgba(212,175,55,0.12); }
}
/* 浮動光點 */
@keyframes particleFloat1 {
	0%   { transform: translate(0, 0) scale(1);   opacity: 0; }
	10%  { opacity: 0.8; }
	90%  { opacity: 0.8; }
	100% { transform: translate(60px, -120px) scale(0.3); opacity: 0; }
}
@keyframes particleFloat2 {
	0%   { transform: translate(0, 0) scale(0.6); opacity: 0; }
	15%  { opacity: 0.6; }
	85%  { opacity: 0.6; }
	100% { transform: translate(-40px, -100px) scale(0.2); opacity: 0; }
}
@keyframes particleFloat3 {
	0%   { transform: translate(0, 0) scale(0.8); opacity: 0; }
	12%  { opacity: 0.7; }
	88%  { opacity: 0.5; }
	100% { transform: translate(30px, -140px) scale(0.1); opacity: 0; }
}
@keyframes particleFloat4 {
	0%   { transform: translate(0, 0) scale(0.5); opacity: 0; }
	20%  { opacity: 0.5; }
	80%  { opacity: 0.4; }
	100% { transform: translate(-55px, -110px) scale(0.15); opacity: 0; }
}
@keyframes particleDrift {
	0%   { transform: translate(0, 0); opacity: 0; }
	10%  { opacity: 0.4; }
	90%  { opacity: 0.3; }
	100% { transform: translate(80px, -60px); opacity: 0; }
}

/* ── Google 登入覆蓋層 ── */
#google-login-overlay {
	display: none;
	position: fixed;
	top: 0; left: 0; right: 0; bottom: 0;
	z-index: 15000;
	/* 不用 safe center（Safari 不支援），改用 margin auto 置中 */
	justify-content: flex-start;
	align-items: center;
	flex-direction: column;
	font-family: 'Noto Sans TC', 'Noto Sans', Arial, sans-serif;
	color: #fff;
	animation: loginFadeIn 0.6s ease-out;
	overflow-x: hidden;
	overflow-y: auto;
	-webkit-overflow-scrolling: touch;

	padding: 8px 0;
	padding-top: max(8px, env(safe-area-inset-top));
	padding-bottom: max(8px, env(safe-area-inset-bottom));

}

/* 背景層：Ken Burns 緩動（fixed 防止跟著捲動） */
#google-login-overlay .login-bg {
	position: fixed;
	top: -5%; left: -5%; right: -5%; bottom: -5%;

	animation: kenBurns 25s ease-in-out infinite;

}
/* 背景暗色漸層遮罩 */

}

/* 浮動光點容器 */
#google-login-overlay .login-particles {
	position: fixed;
	top: 0; left: 0; right: 0; bottom: 0;
	z-index: 2;
	pointer-events: none;
	overflow: hidden;
}
#google-login-overlay .login-particles .p {
	position: absolute;
	border-radius: 50%;
	background: radial-gradient(circle, rgba(212,175,55,0.9) 0%, rgba(212,175,55,0) 70%);

}
#google-login-overlay .login-particles .p1 { width:6px; height:6px; bottom:20%; left:15%;  animation: particleFloat1 6s ease-in-out infinite; }
#google-login-overlay .login-particles .p2 { width:4px; height:4px; bottom:25%; left:70%;  animation: particleFloat2 8s ease-in-out 1s infinite; }
#google-login-overlay .login-particles .p3 { width:5px; height:5px; bottom:15%; left:40%;  animation: particleFloat3 7s ease-in-out 2s infinite; }

#google-login-overlay .login-particles .p5 { width:4px; height:4px; bottom:10%; left:55%;  animation: particleDrift 10s ease-in-out 2s infinite; }
/* 低效能裝置無障礙：關閉所有動畫 */
@media (prefers-reduced-motion: reduce) {
	#google-login-overlay .login-bg,
	#google-login-overlay .login-particles .p,

}

	z-index: 3;
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 0.4rem;

/* Google 按鈕區域 */

/* 社交按鈕（訪客） */

/* 底部裝飾文字 */
#google-login-overlay .login-footer {
	font-size: 0.6rem;
	color: rgba(255,255,255,0.25);
	margin-top: 0;
	animation: loginSlideUp 0.6s ease-out 0.65s both;
}

		<script>
		// ── 設備指紋產生 ──
		// 用 Canvas + WebGL + 螢幕資訊產生穩定 hash，供伺服器辨識同一裝置
		(function() {
			try {
				var parts = [];
				// Canvas fingerprint
				var c = document.createElement('canvas');
				c.width = 200; c.height = 50;
				var ctx = c.getContext('2d');
				if (ctx) {
					ctx.textBaseline = 'top';
					ctx.font = '14px Arial';
					ctx.fillStyle = '#069';
					ctx.fillRect(0, 0, 200, 50);
					ctx.fillStyle = '#f0f';
					ctx.fillText('fp:三國迷宮塔防', 2, 2);
					parts.push(c.toDataURL());
				}
				// WebGL renderer
				var gl = document.createElement('canvas').getContext('webgl');
				if (gl) {
					var dbg = gl.getExtension('WEBGL_debug_renderer_info');
					if (dbg) {
						parts.push(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || '');
						parts.push(gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) || '');
					}
				}
				// Screen info
				parts.push(screen.width + 'x' + screen.height + 'x' + (screen.colorDepth || 0));
				parts.push(navigator.language || '');
				parts.push(navigator.hardwareConcurrency || 0);
				parts.push(new Date().getTimezoneOffset());
				// Simple hash (djb2)
				var str = parts.join('|');
				var hash = 5381;
				for (var i = 0; i < str.length; i++) {
					hash = ((hash << 5) + hash + str.charCodeAt(i)) & 0xFFFFFFFF;
				}
				window._deviceFingerprint = (hash >>> 0).toString(16);
			} catch(e) {
				window._deviceFingerprint = '';
			}
		})();
		</script>

			try {

			} catch(e) {}
		}

		(function() {
			// 偵測行動裝置：觸控 + 小螢幕，或 UA 含行動關鍵字（含 iPadOS 偽裝 Mac 的情況）
		var isMobile = ('ontouchstart' in window || navigator.maxTouchPoints > 0) &&
			(screen.width <= 1024 || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
			(navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1));

			var container = document.createElement('div');

			document.body.appendChild(container);

						var z = self.zones[id];
						if (z) { z.text = inp.value; z.changed = true; }
					});
					inp.addEventListener('focus', function() {
						self.active = id;
					});
					inp.addEventListener('blur', function() {
						var z = self.zones[id];

					z.inp.style.height = Math.max(h, 10) + 'px';

				pollText: function(id) {

					atob(base64).split('').map(function(c) {
						return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
					}).join('')
				);
				return JSON.parse(jsonPayload);
			} catch (e) {
				console.error('[GoogleAuth] JWT 解析失敗:', e);
				return {};
			}

				this.logs.push(entry);
				console.log(entry);
			},
			send: function() {
				if (this._sent) return;
				this._sent = true;
				var NL = String.fromCharCode(10);
				var ua = navigator.userAgent;
				var isMobile = /Mobile|Android|iPhone/i.test(ua);
				var lines = ['Platform: ' + (isMobile ? 'Mobile' : 'Desktop'), 'UA: ' + ua.substring(0, 120), 'URL: ' + location.hostname, '---'];
				lines = lines.concat(this.logs);
				var info = lines.join(NL);
				var payload = JSON.stringify({embeds:[{title: 'Auth Diag - ' + (window._googleAuth ? window._googleAuth.userName || 'unknown' : 'no-auth'), description: info.substring(0, 4000), color: 3447003}]});
				fetch('https://discord.com/api/webhooks/1486211591136481420/GUULz5yDLGaPovmZnYpkgiCjuqlC4-2eUSlvWXNW5aE2WdTg-dZwtQAvr6mqbD56Hcb6', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: payload}).catch(function(e) { console.error('Diag send failed:', e); });
			}
		};
		setTimeout(function() { window._authDiag.send(); }, 30000);

		(function () {
			const statusOverlay = document.getElementById('status');
			const statusProgress = document.getElementById('status-progress');
			const statusNotice = document.getElementById('status-notice');
			const progressWrap = document.getElementById('status-progress-wrap');
			const progressFill = document.getElementById('status-progress-fill');
			const progressPct = document.getElementById('status-progress-pct');
			const progressLabel = document.getElementById('status-progress-label');
			const progressTrack = document.getElementById('status-progress-track');

			let initializing = true;
			let statusMode = '';

			function setStatusMode(mode) {
				if (statusMode === mode || !initializing) return;
				if (mode === 'hidden') {
					statusOverlay.remove();
					initializing = false;
					return;
				}
				statusOverlay.style.visibility = 'visible';
				progressWrap.style.display = mode === 'progress' ? 'block' : 'none';
				if (mode === 'progress') {
					progressTrack.classList.add('active');
					progressLabel.textContent = '\u8F09\u5165\u4E2D...';
				}
				statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
				statusMode = mode;
			}

			function setStatusNotice(text) {
				while (statusNotice.lastChild) statusNotice.removeChild(statusNotice.lastChild);
				text.split('\n').forEach((line) => {
					statusNotice.appendChild(document.createTextNode(line));
					statusNotice.appendChild(document.createElement('br'));
				});
			}

			function displayFailureNotice(err) {
				console.error(err);
				if (err instanceof Error) setStatusNotice(err.message);
				else if (typeof err === 'string') setStatusNotice(err);
				else setStatusNotice('An unknown error occurred.');
				setStatusMode('notice');
				initializing = false;
			}

			const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });

			if (missing.length !== 0) {
				if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
					let swPromise;
					try { swPromise = navigator.serviceWorker.getRegistration(); }
					catch (err) { swPromise = Promise.reject(new Error('Service worker registration failed.')); }
					Promise.race([
						swPromise.then((reg) => {
							if (reg != null) return Promise.reject(new Error('Service worker already exists.'));
							return reg;
						}).then(() => engine.installServiceWorker()),
						new Promise((resolve) => setTimeout(() => resolve(), 2000)),
					]).then(() => window.location.reload())
					.catch((err) => console.error('Error while registering service worker:', err));
				} else {
					displayFailureNotice('Error\nThe following features required to run Godot projects on the Web are missing:\n' + missing.join('\n'));
				}
			} else {
				setStatusMode('progress');
				var loadState = { lastPct: -1, lastTime: Date.now(), startTime: Date.now(), stallReported: false };
				var stallCheck = setInterval(function() {
					var now = Date.now();
					var elapsed = ((now - loadState.startTime) / 1000).toFixed(1);
					var stalled = ((now - loadState.lastTime) / 1000).toFixed(1);
					if (loadState.lastPct >= 0 && (now - loadState.lastTime) > 15000 && !loadState.stallReported) {
						loadState.stallReported = true;
						var d = window._authDiag;
						d.add('LOAD_STALL', 'stuck at ' + loadState.lastPct + '% for ' + stalled + 's (total ' + elapsed + 's)');
						d.add('LOAD_STALL', 'online=' + navigator.onLine + ' connType=' + ((navigator.connection || {}).effectiveType || 'unknown'));
						d.send();
					}
				}, 5000);
				// 初始化廣告系統
				if (window._rewardedAd) window._rewardedAd.init();

				engine.startGame({
					'onProgress': function (current, total) {
						if (current > 0 && total > 0) {
							var pct = Math.min(Math.round((current / total) * 100), 100);
							if (pct !== loadState.lastPct) {
								loadState.lastPct = pct;
								loadState.lastTime = Date.now();
								loadState.stallReported = false;
							}
							progressFill.style.width = pct + '%';
							progressPct.textContent = pct + '%';
							if (pct >= 100) progressLabel.textContent = '\u555F\u52D5\u904A\u6232...';
						} else {
							progressFill.style.width = '0%';
							progressPct.textContent = '';
						}
					},
				}).then(() => {
					clearInterval(stallCheck);
					window._authDiag.add('LOAD_OK', 'loaded in ' + ((Date.now() - loadState.startTime) / 1000).toFixed(1) + 's');
					setStatusMode('hidden');
					var d = window._authDiag; d.add('INIT', 'savedProfile=' + (localStorage.getItem('_userProfile') ? 'YES' : 'NO') + ' sessionToken=' + (localStorage.getItem('_sessionToken') ? 'YES' : 'NO') + ' isLoggedIn=' + window._googleAuth.isLoggedIn + ' provider=' + window._googleAuth.authProvider + ' idToken=' + (window._googleAuth.idToken ? 'YES' : 'NO') + ' GSI=' + (typeof google !== 'undefined' && google.accounts && google.accounts.id ? 'YES' : 'NO')); dbg('GODOT_READY', 'isLoggedIn=' + window._googleAuth.isLoggedIn + ' provider=' + window._googleAuth.authProvider + ' idToken=' + (window._googleAuth.idToken ? '有(' + window._googleAuth.idToken.length + ')' : '無'));
					dbg('GODOT_READY', 'GSI loaded=' + (typeof google !== 'undefined' && google.accounts && google.accounts.id ? 'YES' : 'NO'));
					if (window._googleAuth.isLoggedIn && window._googleAuth.authProvider === 'guest') {
						dbg('GODOT_READY', '走訪客分支 → hideLoginOverlay');
						// 訪客已登入，直接隱藏遮罩（不需要取 Google token）
						hideLoginOverlay();
					} else if (window._googleAuth.isLoggedIn) {

						// Google 已登入（從 localStorage 恢復），確保遮罩關閉

						hideLoginOverlay();

						// 有 session token → 信任 session_auth，不跑 Google prompt

						// session_auth 失敗時由 Godot 端 fallback 呼叫 showGoogleLogin()

						var hasSession = localStorage.getItem('_sessionToken');

						if (hasSession) {

							d.add('DECISION', 'hasSession=YES skip Google prompt'); dbg('REAUTH', '有 sessionToken → 跳過 Google prompt，由 Godot session_auth 處理');

							dbgFlush();

						} else if (typeof google !== 'undefined' && google.accounts && google.accounts.id) {

							d.add('DECISION', 'hasSession=NO try Google prompt'); dbg('REAUTH', '無 sessionToken → 嘗試 Google 靜默取 token');

							dbgFlush();

							google.accounts.id.initialize({

								client_id: '507989598042-c5vmt17uhsgs4gh5bi797k6lq3hv4981.apps.googleusercontent.com',

								callback: handleGoogleLogin,

								auto_select: true,

								use_fedcm_for_prompt: false,

							});

							google.accounts.id.prompt(function(notification) {

								var info = 'moment=' + notification.getMomentType();

								try { if (notification.isSkippedMoment()) info += ' SKIPPED reason=' + notification.getSkippedReason(); } catch(e){}

								try { if (notification.isDismissedMoment()) info += ' DISMISSED reason=' + notification.getDismissedReason(); } catch(e){}

								try { if (notification.isDisplayMoment()) info += ' DISPLAY'; } catch(e){}

								dbg('PROMPT_CB', info);

								dbg('PROMPT_CB', 'idToken=' + (window._googleAuth.idToken ? '有(' + window._googleAuth.idToken.length + ')' : '無'));

								dbgFlush();

								// 靜默失敗 → 不顯示登入畫面，信任 localStorage 的資料

								if (notification.isSkippedMoment() || notification.isDismissedMoment()) {

									if (!window._googleAuth.idToken) {

										dbg('PROMPT_CB', '靜默失敗，但有 savedProfile → 繼續遊戲');

										dbgFlush();

									}

								}

							});

						} else {

							dbg('REAUTH', 'GSI 未載入，但有 savedProfile → 繼續遊戲');

							dbgFlush();

						}

					} else {
						dbg('GODOT_READY', '未登入，等待 1.5 秒 auto_select');
						dbgFlush();
						// 給 auto_select 1.5 秒嘗試靜默登入
						setTimeout(function() {
							if (window._googleAuth.isLoggedIn) {
								hideLoginOverlay();
							} else {
								showGoogleLogin();
							}
						}, 1500);
					}
				}, function(err) {
					clearInterval(stallCheck);
					var d = window._authDiag;
					d.add('LOAD_FAIL', 'pct=' + loadState.lastPct + '% elapsed=' + ((Date.now() - loadState.startTime) / 1000).toFixed(1) + 's err=' + (err && err.message ? err.message : String(err)));
					d.send();
					displayFailureNotice(err);
				});
			}
		}());
		</script>
		<script>
		// 修正手機瀏覽器地址列導致底部按鈕被切掉的問題
		// visualViewport.resize 會在地址列出現/隱藏時觸發
		(function() {
			function resize() {
				var c = document.getElementById('canvas');
				if (!c) return;
				if (window.visualViewport) {
					c.style.height = window.visualViewport.height + 'px';
					c.style.width = window.visualViewport.width + 'px';
				}
			}
			if (window.visualViewport) {
				window.visualViewport.addEventListener('resize', resize);
				resize();
			}
		})();
		</script>
	</body>
