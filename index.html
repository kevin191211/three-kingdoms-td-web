<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<title>三國迷宮塔防</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}
body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}
#canvas {
	display: block;
	width: 100vw !important;
	height: 100vh !important;
}
#canvas:focus {
	outline: none;
}

/* 全螢幕提示覆蓋層 */
#fs-overlay {
	display: none;
	position: fixed;
	top: 0; left: 0; right: 0; bottom: 0;
	background: rgba(0,0,0,0.88);
	z-index: 10000;
	justify-content: center;
	align-items: center;
	flex-direction: column;
	text-align: center;
	font-family: 'Noto Sans TC', 'Noto Sans', Arial, sans-serif;
	cursor: pointer;
	-webkit-tap-highlight-color: transparent;
}
#fs-overlay .fs-icon { font-size: 4rem; margin-bottom: 1rem; }
#fs-overlay .fs-title {
	font-size: 1.8rem;
	color: #ffd633;
	font-weight: bold;
	margin-bottom: 0.5rem;
}
#fs-overlay .fs-subtitle {
	font-size: 1rem;
	color: #ccc;
	margin-bottom: 1.5rem;
}
#fs-overlay .fs-btn {
	background: #c0392b;
	border: 3px solid #e67e22;
	color: white;
	font-size: 1.4rem;
	padding: 1rem 3rem;
	border-radius: 14px;
	font-weight: bold;
	animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse {
	0%, 100% { transform: scale(1); }
	50% { transform: scale(1.1); }
}

/* 直向提示 */
#rotate-notice {
	display: none;
	position: fixed;
	top: 0; left: 0; right: 0; bottom: 0;
	background: #111;
	color: #fff;
	font-family: 'Noto Sans TC', 'Noto Sans', Arial, sans-serif;
	font-size: 1.5rem;
	z-index: 20000;
	justify-content: center;
	align-items: center;
	flex-direction: column;
	text-align: center;
	gap: 1.2rem;
}
#rotate-notice .r-icon {
	font-size: 5rem;
	animation: rotate-anim 2s ease-in-out infinite;
}
@keyframes rotate-anim {
	0%, 100% { transform: rotate(0deg); }
	50% { transform: rotate(90deg); }
}
@media (orientation: portrait) and (max-width: 900px) {
	#rotate-notice { display: flex !important; }
	#canvas { display: none !important; }
	#fs-overlay { display: none !important; }
}

/* 載入畫面 */
#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}
#status, #status-splash {
	top: 0;
	bottom: 0;
}
#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}
#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}
#status-splash.show-image--false { display: none; }
#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}
#status-splash.use-filter--false { image-rendering: pixelated; }
#status-progress, #status-notice { display: none; }
#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}
#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="$GODOT_BASE_PATH.icon.png" />
		<link rel="apple-touch-icon" href="$GODOT_BASE_PATH.apple-touch-icon.png"/>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<!-- 直向提示 -->
		<div id="rotate-notice">
			<div class="r-icon">📱</div>
			<div>請將手機橫向使用</div>
			<div style="font-size:0.9rem;color:#999;">Please rotate to landscape</div>
		</div>

		<!-- 全螢幕提示 -->
		<div id="fs-overlay">
			<div class="fs-icon">🎮</div>
			<div class="fs-title">三國迷宮塔防</div>
			<div class="fs-subtitle">隱藏網址列，獲得最佳遊戲體驗</div>
			<div class="fs-btn" id="fs-btn">⛶ 點擊進入全螢幕</div>
		</div>

		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>Your browser does not support JavaScript.</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="$GODOT_BASE_PATH.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script>
		(function() {
			var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
			var overlay = document.getElementById('fs-overlay');
			var triggered = false;

			function goFullscreen() {
				if (triggered) return;
				triggered = true;

				// 先請求全螢幕，成功後再隱藏覆蓋層
				var el = document.documentElement;
				var fsPromise = null;

				try {
					if (el.requestFullscreen) {
						fsPromise = el.requestFullscreen({navigationUI: 'hide'});
					} else if (el.webkitRequestFullscreen) {
						el.webkitRequestFullscreen();
					}
				} catch(e) {}

				// 鎖定橫向
				try {
					if (screen.orientation && screen.orientation.lock) {
						screen.orientation.lock('landscape').catch(function(){});
					}
				} catch(e) {}

				if (fsPromise && fsPromise.then) {
					fsPromise.then(function() {
						overlay.style.display = 'none';
					}).catch(function() {
						overlay.style.display = 'none';
						triggered = false;
					});
				} else {
					setTimeout(function() { overlay.style.display = 'none'; }, 200);
					triggered = false;
				}
			}

			if (isMobile) {
				var checkReady = setInterval(function() {
					var status = document.getElementById('status');
					if (!status || !status.parentNode || status.style.visibility === 'hidden') {
						clearInterval(checkReady);
						overlay.style.display = 'flex';
					}
				}, 500);

				// 用 click 事件（最可靠的 user gesture）
				overlay.addEventListener('click', function(e) {
					e.preventDefault();
					goFullscreen();
				});

				// 離開全螢幕時再次提示
				var fsEvents = ['fullscreenchange', 'webkitfullscreenchange'];
				fsEvents.forEach(function(evt) {
					document.addEventListener(evt, function() {
						var isFull = !!(document.fullscreenElement || document.webkitFullscreenElement);
						if (!isFull) {
							triggered = false;
							setTimeout(function() { overlay.style.display = 'flex'; }, 300);
						}
					});
				});
			}
		})();
		</script>

		<script src="index.js"></script>
		<script>
		const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":20291428,"index.wasm":37685705},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
		const GODOT_THREADS_ENABLED = false;
		const engine = new Engine(GODOT_CONFIG);

		(function () {
			const statusOverlay = document.getElementById('status');
			const statusProgress = document.getElementById('status-progress');
			const statusNotice = document.getElementById('status-notice');

			let initializing = true;
			let statusMode = '';

			function setStatusMode(mode) {
				if (statusMode === mode || !initializing) return;
				if (mode === 'hidden') {
					statusOverlay.remove();
					initializing = false;
					return;
				}
				statusOverlay.style.visibility = 'visible';
				statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
				statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
				statusMode = mode;
			}

			function setStatusNotice(text) {
				while (statusNotice.lastChild) statusNotice.removeChild(statusNotice.lastChild);
				text.split('\n').forEach((line) => {
					statusNotice.appendChild(document.createTextNode(line));
					statusNotice.appendChild(document.createElement('br'));
				});
			}

			function displayFailureNotice(err) {
				console.error(err);
				if (err instanceof Error) setStatusNotice(err.message);
				else if (typeof err === 'string') setStatusNotice(err);
				else setStatusNotice('An unknown error occurred.');
				setStatusMode('notice');
				initializing = false;
			}

			const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });

			if (missing.length !== 0) {
				if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
					let swPromise;
					try { swPromise = navigator.serviceWorker.getRegistration(); }
					catch (err) { swPromise = Promise.reject(new Error('Service worker registration failed.')); }
					Promise.race([
						swPromise.then((reg) => {
							if (reg != null) return Promise.reject(new Error('Service worker already exists.'));
							return reg;
						}).then(() => engine.installServiceWorker()),
						new Promise((resolve) => setTimeout(() => resolve(), 2000)),
					]).then(() => window.location.reload())
					.catch((err) => console.error('Error while registering service worker:', err));
				} else {
					displayFailureNotice('Error\nThe following features required to run Godot projects on the Web are missing:\n' + missing.join('\n'));
				}
			} else {
				setStatusMode('progress');
				engine.startGame({
					'onProgress': function (current, total) {
						if (current > 0 && total > 0) {
							statusProgress.value = current;
							statusProgress.max = total;
						} else {
							statusProgress.removeAttribute('value');
							statusProgress.removeAttribute('max');
						}
					},
				}).then(() => setStatusMode('hidden'), displayFailureNotice);
			}
		}());
		</script>
	</body>
</html>
